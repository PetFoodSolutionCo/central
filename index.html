<!doctype html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PFS Marketing</title>
<style>
/* Cores da marca tiradas do site (petfoodsolution.com.br): petróleo #004753 e dourado #b3933e.
   As cores das séries dos gráficos (--s1..--s4) continuam as validadas para daltonismo. */
:root {
  color-scheme: light;
  --brand: #004753; --brand-deep: #00303a; --brand-soft: #e3eff0; --gold: #b3933e; --gold-soft: #f6efdc;
  --page: #f3f5f4; --surface: #ffffff; --raised: #ffffff; --sunken: #f7f8f8;
  --ink: #0e1a1c; --ink-2: #4a5759; --muted: #7b8789;
  --grid: #e6eaea; --axis: #c5cdce; --ring: rgba(0,48,58,0.09);
  --shadow: 0 1px 2px rgba(0,48,58,.05), 0 4px 16px rgba(0,48,58,.06);
  --shadow-hover: 0 2px 4px rgba(0,48,58,.06), 0 10px 28px rgba(0,48,58,.10);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s1-soft: rgba(42,120,214,0.14);
  --good: #0ca30c; --good-ink: #006300; --good-soft: #e5f4e5;
  --warning: #fab219; --warning-soft: #fdf3dc; --serious: #ec835a; --serious-soft: #fcebe3;
  --critical: #d03b3b; --critical-soft: #fae6e6;
  --accent: #00707f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --brand: #0a3f48; --brand-deep: #06272d; --brand-soft: #12363c; --gold: #d2b25c; --gold-soft: #3a3220;
    --page: #0b1112; --surface: #141c1d; --raised: #1b2526; --sunken: #10181a;
    --ink: #eef3f3; --ink-2: #b7c3c4; --muted: #849193;
    --grid: #233031; --axis: #34433f; --ring: rgba(255,255,255,0.08);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s1-soft: rgba(57,135,229,0.20); --good-ink: #3fc23f; --good-soft: #15301a;
    --warning-soft: #3a2f14; --serious-soft: #3a2219; --critical-soft: #3a1a1a; --accent: #4cc3d2;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --brand: #0a3f48; --brand-deep: #06272d; --brand-soft: #12363c; --gold: #d2b25c; --gold-soft: #3a3220;
  --page: #0b1112; --surface: #141c1d; --raised: #1b2526; --sunken: #10181a;
  --ink: #eef3f3; --ink-2: #b7c3c4; --muted: #849193;
  --grid: #233031; --axis: #34433f; --ring: rgba(255,255,255,0.08);
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  --shadow-hover: 0 2px 4px rgba(0,0,0,.35), 0 10px 28px rgba(0,0,0,.35);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s1-soft: rgba(57,135,229,0.20); --good-ink: #3fc23f; --good-soft: #15301a;
  --warning-soft: #3a2f14; --serious-soft: #3a2219; --critical-soft: #3a1a1a; --accent: #4cc3d2;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--page); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 14px/1.5 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; font-feature-settings: "cv11", "ss01"; }
a { color: var(--accent); text-decoration: none; font-weight: 500; }
a:hover { text-decoration: underline; }

/* ---------- topo ---------- */
header { position: sticky; top: 0; z-index: 10; color: #fff;
  background: linear-gradient(120deg, var(--brand-deep) 0%, var(--brand) 60%, #0b5a66 100%);
  box-shadow: 0 6px 24px rgba(0,30,36,.18); }
header::after { content: ""; display: block; height: 3px; background: linear-gradient(90deg, var(--gold), #e4cc85 50%, var(--gold)); }
.bar { max-width: 1320px; margin: 0 auto; padding: 14px 20px 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
.logo { width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: linear-gradient(145deg, #d8bd70, var(--gold)); color: var(--brand-deep);
  font-weight: 800; font-size: 13px; letter-spacing: .5px; box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 2px 8px rgba(0,0,0,.2); }
.brand-name { font-weight: 700; font-size: 17px; letter-spacing: -.2px; line-height: 1.2; }
.brand-name span { color: #e4cc85; font-weight: 500; }
.brand small { display: flex; align-items: center; gap: 6px; font-weight: 400; color: rgba(255,255,255,.72); font-size: 12px; margin-top: 2px; }
.live { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; box-shadow: 0 0 0 0 rgba(61,220,132,.6); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(61,220,132,.55); } 70% { box-shadow: 0 0 0 7px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
@media (prefers-reduced-motion: reduce) { .live { animation: none; } }
header label { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.72); }
select, button { font: inherit; color: var(--ink); background: var(--raised); border: 1px solid var(--ring);
  border-radius: 10px; padding: 7px 12px; cursor: pointer; transition: background .15s, border-color .15s; }
header select, header button { color: #fff; background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.18); }
header select:hover, header button:hover { background: rgba(255,255,255,.18); }
header select option { color: var(--ink); background: var(--raised); }
select:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
nav { max-width: 1320px; margin: 0 auto; padding: 4px 20px 12px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { border: 0; border-radius: 99px; background: none; color: rgba(255,255,255,.75);
  padding: 7px 14px; white-space: nowrap; font-size: 13px; font-weight: 500; }
nav button:hover { background: rgba(255,255,255,.10); color: #fff; }
nav button.on { background: #fff; color: var(--brand-deep); font-weight: 650; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
:root[data-theme="dark"] nav button.on { background: var(--gold); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav button.on { background: var(--gold); } }
nav button .ph { font-size: 10px; opacity: .7; margin-left: 4px; }

/* ---------- conteúdo ---------- */
main { max-width: 1320px; margin: 0 auto; padding: 24px 20px 40px; }
section.tab { display: none; }
section.tab.on { display: block; animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
h2 { font-size: 24px; font-weight: 750; letter-spacing: -.4px; margin: 0 0 4px; }
h3 { font-size: 13px; margin: 0 0 12px; font-weight: 650; color: var(--ink); letter-spacing: .1px; }
main > section > h3, section.tab > h3 { font-size: 17px; margin: 28px 0 4px; letter-spacing: -.2px; }
.lead { color: var(--ink-2); margin: 0 0 20px; max-width: 900px; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(12, 1fr); margin-bottom: 16px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 16px; padding: 18px 20px; min-width: 0;
  box-shadow: var(--shadow); transition: box-shadow .2s; }
.card:hover { box-shadow: var(--shadow-hover); }
section.tab > .card, section.tab > .empty { margin-bottom: 16px; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
.c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 1000px) { .c3 { grid-column: span 6; } .c4, .c6, .c8 { grid-column: span 12; } }
@media (max-width: 560px) { .c3 { grid-column: span 12; } .bar, nav, main { padding-left: 16px; padding-right: 16px; } h2 { font-size: 20px; }
  header { position: relative; } /* no celular o topo ocuparia meia tela se ficasse preso */ }
.kpi { position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: linear-gradient(90deg, var(--brand), var(--gold)); }
.kpi .label { color: var(--ink-2); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
.kpi .value { font-size: 30px; font-weight: 750; margin-top: 6px; letter-spacing: -.8px; line-height: 1.15; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
.delta-up, .delta-down { display: inline-block; padding: 1px 7px; border-radius: 99px; font-weight: 600; font-size: 11px; margin-right: 2px; }
.delta-up { color: var(--good-ink); background: var(--good-soft); } .delta-down { color: var(--critical); background: var(--critical-soft); }
.chart { position: relative; height: 260px; }
.chart.tall { height: 320px; }
.empty { border: 1.5px dashed var(--axis); border-radius: 16px; padding: 20px; color: var(--ink-2); background: var(--sunken); }
.empty b { color: var(--ink); }
.empty ul { margin: 8px 0 0; padding-left: 18px; }
.missing { color: var(--muted); }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .5px;
  position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; z-index: 1; }
th:hover { color: var(--ink); }
tbody tr { transition: background .12s; }
tbody tr:hover td { background: var(--sunken); }
tbody tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { max-height: 440px; overflow: auto; margin: 0 -6px; padding: 0 6px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 500; background: var(--sunken); border: 1px solid var(--ring); color: var(--ink-2); white-space: nowrap; }
.pill.ativo { background: var(--good-soft); border-color: transparent; color: var(--good-ink); }
.pill.pausado { background: var(--warning-soft); border-color: transparent; }
.pill.encerrado { background: var(--critical-soft); border-color: transparent; color: var(--critical); }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; background: var(--sunken); border-left: 3px solid var(--axis); }
.alert:has(.critical) { background: var(--critical-soft); border-left-color: var(--critical); }
.alert:has(.serious) { background: var(--serious-soft); border-left-color: var(--serious); }
.alert:has(.warning) { background: var(--warning-soft); border-left-color: var(--warning); }
.alert .icon { width: 20px; height: 20px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; font-weight: 700; }
.alert .icon.critical { background: var(--critical); } .alert .icon.serious { background: var(--serious); } .alert .icon.warning { background: var(--warning); color: #3a2a00; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.tile { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; overflow: hidden; text-decoration: none; color: var(--ink);
  box-shadow: var(--shadow); transition: transform .18s, box-shadow .18s; }
.tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); text-decoration: none; }
.tile .img { aspect-ratio: 4/5; background: var(--grid) center/cover no-repeat; position: relative; }
.tile .img span { position: absolute; top: 8px; left: 8px; background: rgba(0,30,36,.72); backdrop-filter: blur(4px); color: #fff; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 99px; }
.tile .meta { padding: 10px; font-size: 12px; color: var(--ink-2); display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; font-weight: 400; }
.tile .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin: -4px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.sum-block { margin-bottom: 12px; }
.sum-block > b { display: inline-block; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--accent); }
.sum-block ul { margin: 4px 0 0; padding-left: 18px; }
.sum-block li { margin-bottom: 4px; color: var(--ink); }
.sum-block li::marker { color: var(--gold); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.status-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px 16px; font-size: 12px; }
.status-list > div { display: flex; gap: 8px; align-items: baseline; padding: 6px 10px; border-radius: 10px; background: var(--sunken); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; }
.dot.ok { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); } .dot.no { background: var(--axis); }
details { border-bottom: 1px solid var(--grid); padding: 8px 0; }
details summary { cursor: pointer; font-weight: 500; }
details summary::marker { color: var(--gold); }
ul { padding-left: 18px; } li { margin-bottom: 3px; }
footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 16px 32px; }
footer b { color: var(--gold); font-weight: 600; }
.phase2 { text-align: center; padding: 40px 16px; }
</style>

<header>
  <div class="bar">
    <div class="brand"><div class="logo">PFS</div><div><div class="brand-name">Pet Food Solution <span>· Marketing</span></div><small><i class="live"></i><span id="updated">—</span></small></div></div>
    <label>Período <select id="period">
      <option value="7">Últimos 7 dias</option>
      <option value="30">Últimos 30 dias</option>
      <option value="90" selected>Últimos 90 dias</option>
      <option value="365">Últimos 12 meses</option>
      <option value="0">Tudo</option>
    </select></label>
    <label>Perfil <select id="profile"></select></label>
    <button id="theme" title="Alternar tema">◐</button>
  </div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>
<footer><b>Pet Food Solution</b> · painel de marketing · atualiza sozinho com as coletas</footer>

<script>window.ESPERAR_DADOS = true;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// Local: data.js. Link publicado: os dados chegam pela tela de senha (portal/cadeado.html).
let D = window.PFS_DATA || {};
const TABS = [
  ["geral", "Visão geral", 1], ["instagram", "Instagram", 1], ["parceiros", "Parceiros", 1],
  ["midia", "Mídia paga", 1], ["leads", "Leads", 1], ["site", "Site", 1],
  ["atendimento", "Atendimento e reputação", 1], ["concorrencia", "Concorrência", 1],
  ["precos", "Preços e promoções", 1], ["conteudo", "Conteúdo, SEO e GEO", 1],
];
const NEEDS = {
  instagram: "token da Meta com acesso aos perfil @petfoodsolutioneco",
  comentarios: "token da Meta com a permissão instagram_manage_comments",
  parceiros_instagram: "token da Meta (Business Discovery) para ler os perfis dos parceiros",
  meta_ads: "token da Meta com ads_read e o ID da conta de anúncios",
  google_ads: "script do Google Ads instalado e a planilha que ele preenche",
  ga4: "acesso de leitor ao GA4 para a conta de serviço",
  search_console: "acesso ao Search Console para a conta de serviço",
  pagespeed: "chave gratuita da API PageSpeed Insights",
  site_no_ar: "URL do site no .env",
  concorrentes: "token da Meta (Business Discovery) e os @ dos concorrentes em COMPETITORS no .env",
  reclame_aqui: "página pública da PFS no Reclame Aqui (RECLAMEAQUI no .env)",
  noticias: "acesso ao RSS do Google Notícias (NEWS_QUERIES no .env)",
  seo_site: "URL do site no .env (SITE_URL)",
  precos: "acesso às buscas da Cobasi e da Petlove",
  geo_gemini: "chave gratuita do Gemini (GEMINI_API_KEY no .env, criada em aistudio.google.com)",
  buscas_google: "acesso ao autocompletar do Google (SEO_SEEDS no .env)",
};
const charts = [];
let generation = 0;
// Desenha depois que o HTML da aba entrou na página; ignora se outra renderização já começou.
function later(fn) {
  const g = generation;
  setTimeout(() => { if (g !== generation) return; try { fn(); } catch (e) { console.error(e); } });
}
const $ = (s, el = document) => el.querySelector(s);
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const fmt = (v, d = 0) => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d });
const pct = (v, d = 1) => v == null || isNaN(v) ? "—" : (v * 100).toLocaleString("pt-BR", { maximumFractionDigits: d, minimumFractionDigits: d }) + "%";
const brl = v => v == null || isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
const short = v => v == null ? "—" : Math.abs(v) >= 1e6 ? fmt(v / 1e6, 1) + " mi" : Math.abs(v) >= 1e4 ? fmt(v / 1e3, 1) + " mil" : fmt(v);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sum = (a, f) => a.reduce((t, x) => t + (+f(x) || 0), 0);
const groupBy = (a, f) => a.reduce((m, x) => ((m[f(x)] ??= []).push(x), m), {});
const monthLabel = ym => { const [y, m] = ym.split("-"); return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][+m - 1] + "/" + y.slice(2); };

function cutoff() {
  const days = +$("#period").value;
  if (!days) return "0000-00-00";
  const d = new Date(); d.setDate(d.getDate() - days);
  return d.toISOString().slice(0, 10);
}
const inPeriod = date => date >= cutoff();
const profileSel = () => $("#profile").value;
const ofProfile = p => !profileSel() || p === profileSel();

function status(name) { return (D.status || {})[name]; }
function emptyCard(title, sources, extra = "") {
  const reasons = sources.map(s => {
    const st = status(s);
    const why = st && !st.ok ? ` <span class="missing">(${esc(st.message)})</span>` : "";
    return `<li>${esc(NEEDS[s] || s)}${why}</li>`;
  }).join("");
  return `<div class="empty"><b>${esc(title)}: sem dados ainda.</b> Para aparecer, falta:<ul>${reasons}</ul>${extra}</div>`;
}
function kpi(label, value, sub = "") {
  return `<div class="card kpi c3"><div class="label">${label}</div><div class="value">${value}</div><div class="sub">${sub}</div></div>`;
}
function delta(cur, prev) {
  if (prev == null || !prev || cur == null) return "";
  const d = (cur - prev) / Math.abs(prev);
  return `<span class="${d >= 0 ? "delta-up" : "delta-down"}">${d >= 0 ? "▲" : "▼"} ${pct(Math.abs(d), 0)}</span> vs período anterior`;
}
function prevWindow(rows, dateKey, f) {
  const days = +$("#period").value; if (!days) return null;
  const end = cutoff(); const s = new Date(end); s.setDate(s.getDate() - days);
  const start = s.toISOString().slice(0, 10);
  return sum(rows.filter(r => r[dateKey] >= start && r[dateKey] < end), f);
}

// ---------- gráficos ----------
function baseOpts(extra = {}) {
  const grid = css("--grid"), muted = css("--muted");
  if (window.Chart) { Chart.defaults.font.family = getComputedStyle(document.body).fontFamily; Chart.defaults.font.size = 12; }
  return Object.assign({
    responsive: true, maintainAspectRatio: false, animation: { duration: 500, easing: "easeOutQuart" },
    interaction: { mode: "index", intersect: false },
    plugins: { legend: { display: false }, tooltip: { backgroundColor: css("--raised"), titleColor: css("--ink"),
      bodyColor: css("--ink-2"), borderColor: css("--ring"), borderWidth: 1, padding: 12, boxPadding: 4, cornerRadius: 10,
      titleFont: { weight: "600" }, usePointStyle: true } },
    scales: {
      x: { grid: { display: false }, border: { color: css("--axis") }, ticks: { color: muted, maxRotation: 0, autoSkipPadding: 14 } },
      y: { grid: { color: grid }, border: { display: false }, ticks: { color: muted, callback: v => short(v) }, beginAtZero: true },
    },
  }, extra);
}
function chart(el, cfg) {
  if (!window.Chart) { el.innerHTML = '<p class="missing">Gráficos precisam de internet (Chart.js).</p>'; return; }
  const canvas = document.createElement("canvas"); el.appendChild(canvas);
  charts.push(new Chart(canvas, cfg));
}
function bars(el, labels, values, opts = {}) {
  chart(el, { type: "bar", data: { labels, datasets: [{ data: values, backgroundColor: opts.color || css("--s1"),
    borderRadius: 6, borderSkipped: "start", maxBarThickness: 28, label: opts.label || "" }] },
    options: baseOpts(opts.horizontal ? { indexAxis: "y", scales: {
      y: { grid: { display: false }, ticks: { color: css("--ink-2"), autoSkip: false } },
      x: { grid: { color: css("--grid") }, border: { display: false }, ticks: { color: css("--muted"), callback: v => opts.pct ? pct(v, 0) : short(v) }, beginAtZero: true } } } : {}) });
}
function lines(el, labels, series) {
  chart(el, { type: "line", data: { labels, datasets: series.map(s => Object.assign({
    borderWidth: 2, pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: css("--surface"),
    tension: 0.3, fill: false }, s)) }, options: baseOpts() });
}
function legend(items) {
  return `<div class="legend">${items.map(([c, t]) => `<span><i style="background:${c}"></i>${esc(t)}</span>`).join("")}</div>`;
}
function sortableTable(id, cols, rows) {
  // cols: [label, key, {num, render}]
  const head = cols.map((c, i) => `<th class="${c[2]?.num ? "n" : ""}" data-i="${i}">${c[0]}</th>`).join("");
  const body = rows.map(r => `<tr>${cols.map(c => `<td class="${c[2]?.num ? "n" : ""}">${c[2]?.render ? c[2].render(r) : esc(r[c[1]] ?? "—")}</td>`).join("")}</tr>`).join("");
  later(() => {
    const t = document.getElementById(id); if (!t) return;
    t.querySelectorAll("th").forEach(th => th.onclick = () => {
      const c = cols[+th.dataset.i]; const dir = th.dataset.dir === "d" ? 1 : -1; th.dataset.dir = dir === 1 ? "a" : "d";
      rows.sort((a, b) => { const x = a[c[1]], y = b[c[1]]; return (x == null) - (y == null) || (x > y ? 1 : x < y ? -1 : 0) * dir; });
      t.querySelector("tbody").innerHTML = rows.map(r => `<tr>${cols.map(cc => `<td class="${cc[2]?.num ? "n" : ""}">${cc[2]?.render ? cc[2].render(r) : esc(r[cc[1]] ?? "—")}</td>`).join("")}</tr>`).join("");
    });
  });
  return `<div class="scroll"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function countBars(el, rows, key, top = 10, horizontal = true) {
  const g = Object.entries(groupBy(rows, r => r[key] ?? "Não informado")).map(([k, v]) => [k, v.length]).sort((a, b) => b[1] - a[1]);
  const head = g.slice(0, top); const rest = g.slice(top);
  if (rest.length) head.push(["Outros", sum(rest, x => x[1])]);
  el.style.height = horizontal ? Math.max(160, head.length * 28 + 40) + "px" : "";
  bars(el, head.map(x => x[0]), head.map(x => x[1]), { horizontal, label: "Leads" });
}

        ["Faixa planilha", "engagement_range", { render: r => esc(r.engagement_range || "—") }],
        ["Posts/sem.", "ppw", { num: 1, render: r => fmt(r.ppw, 1) }],

R.midia = () => {
  const M = D.ads?.meta, G = D.ads?.google;
  let h = `<h2>Mídia paga</h2><p class="lead">Meta Ads e Google Ads lado a lado. "Resultados" segue o objetivo de cada campanha (leads, conversas ou cliques).</p>`;
  if (!M && !G) return h + emptyCard("Mídia paga", ["meta_ads", "google_ads"]);
  const blocks = [["Meta Ads", M, "meta_ads", "--s1"], ["Google Ads", G, "google_ads", "--s2"]];
  h += `<div class="grid">`;
  blocks.forEach(([name, src]) => {
    const rows = (src?.rows || []).filter(r => inPeriod(r.date));
    const spend = sum(rows, r => r.spend), imp = sum(rows, r => r.impressions), clk = sum(rows, r => r.clicks), res = sum(rows, r => r.results);
    h += kpi(`${name} · investimento`, src ? brl(spend) : "—", src ? delta(spend, prevWindow(src.rows, "date", r => r.spend)) : "sem acesso");
    h += kpi(`${name} · CTR / CPC`, src ? `${pct(imp ? clk / imp : null, 2)}` : "—", src ? `CPC ${brl(clk ? spend / clk : null)} · CPM ${brl(imp ? spend / imp * 1000 : null)}` : "");
  });
  h += `</div><div class="grid"><div class="card c12"><h3>Investimento diário</h3>${legend(blocks.filter(b => b[1]).map(b => [css(b[3]), b[0]]))}<div class="chart" id="ch-spend"></div></div>`;
  blocks.forEach(([name, src, key]) => {
    if (!src) { h += `<div class="card c12">${emptyCard(name, [key])}</div>`; return; }
    const rows = src.rows.filter(r => inPeriod(r.date));
    const camp = Object.entries(groupBy(rows, r => r.campaign)).map(([c, rs]) => {
      const spend = sum(rs, r => r.spend), imp = sum(rs, r => r.impressions), clk = sum(rs, r => r.clicks), res = sum(rs, r => r.results);
      return { campaign: c, spend, imp, clk, res, ctr: imp ? clk / imp : null, cpc: clk ? spend / clk : null, cpr: res ? spend / res : null };
    });
    h += `<div class="card c12"><h3>${name}: campanhas</h3>${sortableTable("t-c-" + key, [["Campanha", "campaign"],
      ["Investimento", "spend", { num: 1, render: r => brl(r.spend) }], ["Impressões", "imp", { num: 1, render: r => fmt(r.imp) }],
      ["Cliques", "clk", { num: 1, render: r => fmt(r.clk) }], ["CTR", "ctr", { num: 1, render: r => pct(r.ctr, 2) }],
      ["CPC", "cpc", { num: 1, render: r => brl(r.cpc) }], ["Resultados", "res", { num: 1, render: r => fmt(r.res) }],
      ["Custo/result.", "cpr", { num: 1, render: r => brl(r.cpr) }]], camp.sort((a, b) => b.spend - a.spend))}</div>`;
  });
  if (M) {
    const ads = Object.values(groupBy(M.rows.filter(r => inPeriod(r.date)), r => r.ad_id)).map(rs => {
      const spend = sum(rs, r => r.spend), clk = sum(rs, r => r.clicks), imp = sum(rs, r => r.impressions), res = sum(rs, r => r.results);
      return { ad: rs[0].ad, ad_id: rs[0].ad_id, campaign: rs[0].campaign, spend, clk, imp, res, ctr: imp ? clk / imp : null, cpr: res ? spend / res : null, cr: M.creatives[rs[0].ad_id] || {} };
    });
    h += `<div class="card c12"><h3>Criativos Meta</h3>${sortableTable("t-ads", [
      ["Criativo", "ad", { render: r => `<div style="display:flex;gap:8px;align-items:center">${r.cr.thumbnail ? `<img src="${esc(r.cr.thumbnail)}" width="44" height="44" style="border-radius:6px;object-fit:cover">` : ""}<div>${r.cr.permalink ? `<a href="${esc(r.cr.permalink)}" target="_blank" rel="noopener">${esc(r.ad)}</a>` : esc(r.ad)}<br><span class="missing">${esc(r.campaign)}</span></div></div>` }],
      ["Investimento", "spend", { num: 1, render: r => brl(r.spend) }], ["CTR", "ctr", { num: 1, render: r => pct(r.ctr, 2) }],
      ["Resultados", "res", { num: 1, render: r => fmt(r.res) }], ["Custo/result.", "cpr", { num: 1, render: r => brl(r.cpr) }]],
      ads.sort((a, b) => b.spend - a.spend))}</div>`;
  }
  h += `</div>`;
  later(() => {
    const days = new Set(); blocks.forEach(([, s]) => (s?.rows || []).forEach(r => inPeriod(r.date) && days.add(r.date)));
    const labels = [...days].sort();
    lines($("#ch-spend"), labels.map(d => d.split("-").reverse().slice(0, 2).join("/")), blocks.filter(b => b[1]).map(([name, src, , c]) => {
      const by = groupBy(src.rows, r => r.date); return { label: name, borderColor: css(c), data: labels.map(d => by[d] ? sum(by[d], r => r.spend) : 0) };
    }));
  });
  return h;
};

R.leads = () => {

  if (!L) return `<h2>Leads</h2>` + emptyCard("Leads", ["planilha_leads"]);
  const rows = L.rows.filter(r => inPeriod(r.date));
  const q = L.quality;
  const months = groupBy(L.rows, r => r.date.slice(0, 7));
  const mKeys = Object.keys(months).sort().filter(m => m >= cutoff().slice(0, 7));
  const g = D.ads?.google;
  let h = `<h2>Leads</h2><p class="lead">Planilha do atendimento, atualizada até <b>${q.last_date.split("-").reverse().join("/")}</b>. Sem o TOTVS, não dá para saber quem comprou; se a planilha ganhar a coluna "Comprou?" (Sim/Não), a conversão aparece aqui automaticamente.</p>`;
  if (!rows.length) h += `<div class="empty">Nenhum lead no período selecionado: a planilha termina em ${q.last_date.split("-").reverse().join("/")}. Escolha "Últimos 12 meses" ou "Tudo" no topo.</div><br>`;
  const gLeads = rows.filter(r => r.origin === "Google").length;
  const gSpend = g ? sum(g.rows.filter(r => inPeriod(r.date)), r => r.spend) : null;
  h += `<div class="grid">${kpi("Leads no período", fmt(rows.length), delta(rows.length, prevWindow(L.rows, "date", () => 1)))}
    ${kpi("Lojistas", fmt(rows.filter(r => r.classification === "Lojista").length), pct(rows.length ? rows.filter(r => r.classification === "Lojista").length / rows.length : null, 0) + " dos leads")}
    ${kpi("Origem Google", fmt(gLeads), g ? `CPL Google ${brl(gLeads ? gSpend / gLeads : null)}` : "CPL precisa do Google Ads")}
    ${kpi("Sem origem informada", pct(rows.length ? rows.filter(r => r.origin === "Não informado").length / rows.length : null, 0), `${fmt(rows.filter(r => r.has_cnpj).length)} com CNPJ`)}</div>`;
  h += `<div class="grid"><div class="card c12"><h3>Leads por mês</h3><div class="chart" id="ch-l-month"></div></div>
    <div class="card c4"><h3>Tipo de cliente</h3><div class="chart" id="ch-l-class"></div></div>
    <div class="card c4"><h3>Estado</h3><div class="chart" id="ch-l-state"></div></div>
    <div class="card c4"><h3>Canal de origem</h3><div class="chart" id="ch-l-origin"></div></div>
    <div class="card c6"><h3>Canal de contato</h3><div class="chart" id="ch-l-channel"></div></div>
    <div class="card c6"><h3>Encaminhado para (top 10)</h3><div class="chart" id="ch-l-seller"></div></div>
    <div class="card c12"><h3>Cidades (top 25)</h3>${sortableTable("t-l-city", [["Cidade", "city"], ["UF", "state"], ["Leads", "n", { num: 1 }], ["Lojistas", "loj", { num: 1 }]],
      Object.values(groupBy(rows, r => r.city + "|" + r.state)).map(rs => ({ city: rs[0].city, state: rs[0].state, n: rs.length, loj: rs.filter(r => r.classification === "Lojista").length })).sort((a, b) => b.n - a.n).slice(0, 25))}</div></div>`;
  h += `<p class="missing">Qualidade: ${fmt(q.missing_origin)} de ${fmt(q.total_rows)} leads sem "Canal de Origem". Códigos de "Tipo de Atendimento": ${Object.entries(L.type_codes).map(([k, v]) => `${k}=${v}`).join(", ")} (significado a confirmar).</p>`;
  later(() => {
    bars($("#ch-l-month"), mKeys.map(monthLabel), mKeys.map(m => months[m].length), { label: "Leads" });
    countBars($("#ch-l-class"), rows, "classification", 6);
    countBars($("#ch-l-state"), rows, "state", 8);
    countBars($("#ch-l-origin"), rows, "origin", 5);
    countBars($("#ch-l-channel"), rows, "channel", 6);
    countBars($("#ch-l-seller"), rows, "seller", 10);
  });
  return h;
};

      <div class="card c6"><h3>Páginas mais vistas</h3>${sortableTable("t-s-pages", [["Página", "pagePath"], ["Views", "v", { num: 1, render: r => fmt(r.v) }], ["Taxa de saída", "b", { num: 1, render: r => pct(r.b) }]],

    S.gsc.queries.map(r => ({ q: r.keys[0], clicks: r.clicks, impressions: r.impressions, position: r.position })))}</div>`;

R.concorrencia = () => {

  h += `<div class="card" style="margin-bottom:12px"><h3>Comparativo</h3>${sortableTable("t-comp", [
    ["Marca", "name", { render: r => `<a href="https://www.instagram.com/${esc(r.handle)}/" target="_blank" rel="noopener">${esc(label(r))}</a>` }],
    ["Seguidores", "followers", { num: 1, render: r => fmt(r.followers) }],
    ["Ganho 7d", "growth_7d", { num: 1, render: r => r.growth_7d == null ? '<span class="missing">—</span>' : fmt(r.growth_7d) }],

    ["Engaj.", "engagement_rate", { num: 1, render: r => pct(r.engagement_rate, 2) }],
    ["Curtidas (mediana)", "median_likes", { num: 1, render: r => fmt(r.median_likes) }], ["Coment. (mediana)", "median_comments", { num: 1, render: r => fmt(r.median_comments) }]],
    sorted("followers"))}<p class="missing">Ganho de seguidores aparece quando houver 7 e 30 dias de coleta. Posts com curtidas ocultas ficam fora do engajamento.${Object.keys(C.errors || {}).length ? " Não lidos hoje: " + Object.keys(C.errors).map(h => "@" + esc(h)).join(", ") + "." : ""}</p></div>`;

<!-- Tela de senha do link publicado (mesmo esquema da Central da Mundo Pura).
     Os dados (dados.enc) vão criptografados: PBKDF2-SHA256 (150 mil iterações) + AES-256-CBC + HMAC-SHA256,
     abertos só no navegador. Sem a senha ninguém lê os números, nem olhando o código da página. -->
<div id="cadeado" style="position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;color:var(--ink);background:radial-gradient(1200px 600px at 20% 0%, #0b5a66 0%, transparent 60%),linear-gradient(140deg, var(--brand-deep), var(--brand))">
  <form id="cadForm" style="width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:32px;box-shadow:0 30px 80px rgba(0,20,24,.45);border-top:4px solid var(--gold)">
    <div class="logo" style="width:52px;height:52px;border-radius:14px;font-size:15px;margin-bottom:18px">PFS</div>
    <h1 style="font-size:22px;font-weight:750;letter-spacing:-.4px;margin:0 0 4px">Pet Food Solution <span style="color:var(--gold);font-weight:500">· Marketing</span></h1>
    <p style="color:var(--ink-2);margin:0 0 22px;font-size:14px">Acesso restrito. Digite a senha para abrir o painel.</p>
    <label for="cadSenha" style="display:block;font-size:11px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px">Senha</label>
    <input id="cadSenha" type="password" autocomplete="current-password" required style="width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--axis);background:var(--sunken);color:var(--ink);font:inherit;font-size:15px">
    <label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;color:var(--ink-2)"><input id="cadLembrar" type="checkbox"> Lembrar neste aparelho</label>
    <button id="cadBotao" type="submit" style="width:100%;margin-top:18px;padding:12px;border:0;border-radius:12px;background:linear-gradient(120deg, var(--brand-deep), var(--brand));color:#fff;font-weight:650;font-size:15px">Entrar</button>
    <div id="cadErro" style="color:var(--critical);font-size:13px;margin-top:12px" hidden></div>
  </form>
</div>
<script>
(function () {
  'use strict';
  let senha = null;

  async function baixar() {
    const r = await fetch('dados.enc?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('Não consegui baixar os dados (' + r.status + ').');
    return new Uint8Array(await r.arrayBuffer());
  }

  // formato: "PF1" + sal(16) + iv(16) + hmac(32) + cifra (gzip do JSON)
  async function abrir(s, b) {
    if (b[0] !== 0x50 || b[1] !== 0x46 || b[2] !== 0x31) throw new Error('Arquivo de dados inválido.');
    const sal = b.slice(3, 19), iv = b.slice(19, 35), mac = b.slice(35, 67), cifra = b.slice(67);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(s), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: sal, iterations: 150000, hash: 'SHA-256' }, base, 512));
    const kAes = await crypto.subtle.importKey('raw', bits.slice(0, 32), 'AES-CBC', false, ['decrypt']);
    const kMac = await crypto.subtle.importKey('raw', bits.slice(32), { name: 'HMAC', hash: 'SHA-256' }, false, ['verify']);
    const assinado = new Uint8Array(sal.length + iv.length + cifra.length);
    assinado.set(sal, 0); assinado.set(iv, sal.length); assinado.set(cifra, sal.length + iv.length);
    if (!(await crypto.subtle.verify('HMAC', kMac, mac, assinado))) throw new Error('senha');
    const plano = await crypto.subtle.decrypt({ name: 'AES-CBC', iv }, kAes, cifra);
    const texto = await new Response(new Blob([plano]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(texto);
  }

  function botaoSair() {
    const sair = document.createElement('button');
    sair.textContent = 'Sair';
    sair.title = 'Sair e esquecer a senha neste aparelho';
    sair.onclick = () => { try { localStorage.removeItem('pfs-link-senha'); } catch (e) {} location.reload(); };
    document.querySelector('header .bar').appendChild(sair);
  }

  async function entrar(s, lembrar) {
    const erro = document.getElementById('cadErro'), botao = document.getElementById('cadBotao');
    erro.hidden = true; botao.disabled = true; botao.textContent = 'Abrindo…';
    try {
      const dados = await abrir(s, await baixar());
      senha = s;
      try { if (lembrar) localStorage.setItem('pfs-link-senha', s); } catch (e) {}
      document.getElementById('cadeado').remove();
      botaoSair();
      window.atualizarPortal(dados);
      setInterval(atualizar, 5 * 60000);
    } catch (e) {
      erro.textContent = e.message === 'senha' ? 'Senha incorreta.' : e.message;
      erro.hidden = false;
      try { localStorage.removeItem('pfs-link-senha'); } catch (x) {}
    } finally {
      botao.disabled = false; botao.textContent = 'Entrar';
    }
  }

  async function atualizar() {
    try { window.atualizarPortal(await abrir(senha, await baixar())); } catch (e) { /* tenta de novo no próximo ciclo */ }
  }

  document.getElementById('cadForm').addEventListener('submit', e => {
    e.preventDefault();
    entrar(document.getElementById('cadSenha').value, document.getElementById('cadLembrar').checked);
  });
  let guardada = null;
  try { guardada = localStorage.getItem('pfs-link-senha'); } catch (e) {}
  if (guardada) entrar(guardada, true); else document.getElementById('cadSenha').focus();
})();
</script>
