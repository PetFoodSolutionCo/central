# Coleta do painel PFS na nuvem (GitHub Actions). Enviado para .github/workflows/coleta.yml pelo nuvem.ps1.
# Código, .env e histórico ficam criptografados no release "nuvem" (codigo.enc e estado.enc).
# A cada 15 min roda a coleta leve; a primeira rodada depois das 6h (Brasília) faz a coleta completa.
name: Coleta do painel

on:
  schedule:
    # minutos "quebrados": no :00/:15 o GitHub fica sobrecarregado e atrasa ou pula rodadas
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'auto, hourly (leve) ou daily (completa)'
        default: auto

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coleta:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      CHAVE_NUVEM: ${{ secrets.CHAVE_NUVEM }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github

      - name: Fuso de Brasília
        run: tzutil /s "E. South America Standard Time"

      - name: Abrir pacotes
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          gh release download nuvem -p codigo.enc -p estado.enc -D pacotes -R $env:GITHUB_REPOSITORY
          .github\cripto.ps1 abrir pacotes\codigo.enc app
          .github\cripto.ps1 abrir pacotes\estado.enc app

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Instalar dependências
        run: python -m pip install --quiet -r app/requirements.txt

      # Atualização feita pelo site do GitHub (o nuvem.ps1 fica bloqueado pelo antivírus no PC):
      # ATUALIZACAO_1..6 = arquivos de código novos (tar.xz em base64, gerados por atualizar-pela-web\gerar.py);
      # PLANO_ALCANCE = o plano_alcance.txt inteiro (boletos aprovados, meta), trocado sozinho a cada mês.
      - name: Aplicar atualização do código
        shell: python
        working-directory: app
        env:
          ATUALIZACAO_1: ${{ secrets.ATUALIZACAO_1 }}
          ATUALIZACAO_2: ${{ secrets.ATUALIZACAO_2 }}
          ATUALIZACAO_3: ${{ secrets.ATUALIZACAO_3 }}
          ATUALIZACAO_4: ${{ secrets.ATUALIZACAO_4 }}
          ATUALIZACAO_5: ${{ secrets.ATUALIZACAO_5 }}
          ATUALIZACAO_6: ${{ secrets.ATUALIZACAO_6 }}
          PLANO_ALCANCE: ${{ secrets.PLANO_ALCANCE }}
        run: |
          import base64, io, os, tarfile
          b = "".join(os.environ.get(f"ATUALIZACAO_{i}", "").strip() for i in range(1, 7))
          if b:
              with tarfile.open(fileobj=io.BytesIO(base64.b64decode(b)), mode="r:xz") as t:
                  t.extractall(".", filter="data")
                  print("Codigo atualizado:", ", ".join(t.getnames()))
          plano = os.environ.get("PLANO_ALCANCE", "").strip()
          if plano:
              with open("plano_alcance.txt", "w", encoding="utf-8") as f:
                  f.write(plano + "\n")
              print("plano_alcance.txt atualizado")

      - name: Coletar
        shell: powershell
        working-directory: app
        run: |
          $hoje = Get-Date -Format 'yyyy-MM-dd'
          $marca = 'data\ultima_completa.txt'
          $ultima = $(if (Test-Path $marca) { (Get-Content $marca -Raw).Trim() } else { '' })
          $modo = '${{ github.event.inputs.modo }}'
          if (-not $modo -or $modo -eq 'auto') { $modo = $(if ((Get-Date).Hour -ge 6 -and $ultima -ne $hoje) { 'daily' } else { 'hourly' }) }
          Write-Host "Modo: $modo"
          $pyArgs = @('-X', 'utf8', 'run_daily.py')
          if ($modo -eq 'hourly') { $pyArgs += '--hourly' }
          python @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "run_daily.py terminou com código $LASTEXITCODE" }
          if ($modo -eq 'daily') { Set-Content $marca $hoje }

      - name: Montar a página
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File app\publicar.ps1 -Nuvem

      - name: Salvar histórico
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          New-Item -ItemType Directory -Force estado\data | Out-Null
          python -c "import sqlite3; s=sqlite3.connect('app/data/pfs.sqlite'); d=sqlite3.connect('estado/data/pfs.sqlite'); s.backup(d); d.close(); s.close()"
          if (Test-Path app\data\ultima_completa.txt) { Copy-Item app\data\ultima_completa.txt estado\data\ }
          .github\cripto.ps1 fechar estado pacotes\estado.enc
          gh release upload nuvem pacotes\estado.enc --clobber -R $env:GITHUB_REPOSITORY

      - name: Manter o agendamento ligado
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/coleta.yml/enable"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: app/site
          retention-days: 1

  publicar:
    needs: coleta
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
